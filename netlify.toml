[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # 이 헤더는 Netlify 배포(운영·프리뷰)에만 적용되고 로컬 next dev에는 붙지 않는다.
    # script-src의 unsafe-inline은 Next.js가 하이드레이션·RSC 페이로드를 인라인 <script>로 내보내므로 유지한다
    # (nonce 기반 CSP로 바꾸려면 모든 페이지가 동적 렌더링이 되어야 해 보류). unsafe-eval은 운영 번들에 불필요해 제거했다.
    # 데이터 유출·클릭재킹 방어에 핵심인 connect-src(백엔드 화이트리스트)·img-src·frame-ancestors·object-src·base-uri를 조인다.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"
