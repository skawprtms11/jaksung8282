<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">TPL Weekly Data System</title>
  <desc id="desc">Rounded app icon with warehouse shelves, TPL logotype, and weekly data system label.</desc>
  <defs>
    <linearGradient id="card" x1="196" x2="844" y1="80" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#dbeaff"/>
    </linearGradient>
    <linearGradient id="blue" x1="205" x2="817" y1="500" y2="775" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08275b"/>
      <stop offset="0.52" stop-color="#0a3a82"/>
      <stop offset="1" stop-color="#075be8"/>
    </linearGradient>
    <linearGradient id="line" x1="246" x2="778" y1="159" y2="497" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cfe0f3"/>
      <stop offset="0.5" stop-color="#9fbee1"/>
      <stop offset="1" stop-color="#c9dff5"/>
    </linearGradient>
    <linearGradient id="box" x1="298" x2="711" y1="291" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e5cfad"/>
      <stop offset="1" stop-color="#cfb18c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#0b2d5f" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#075be8" flood-opacity="0.10"/>
    </filter>
    <filter id="innerGlow" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset dy="2"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="inner"/>
      <feColorMatrix in="inner" type="matrix" values="0 0 0 0 0.54 0 0 0 0 0.70 0 0 0 0 0.90 0 0 0 0.32 0"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
    <clipPath id="clip">
      <rect x="96" y="64" width="832" height="896" rx="174"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="#f5f9ff"/>
  <rect x="96" y="64" width="832" height="896" rx="174" fill="url(#card)" filter="url(#softShadow)"/>
  <g clip-path="url(#clip)">
    <path d="M114 793c74 74 147 82 207 29 52-46 97-47 146 1 50 49 100 49 150 0 50-48 96-47 148 1 61 55 134 43 197-30v191H114V793Z" fill="#d6e8fb"/>
    <path d="M128 66h768v780c-48 58-111 61-166 10-71-66-136-67-204-1-68 65-134 65-202 0-68-66-134-65-204 1-49 46-101 46-150 5V66Z" fill="#ffffff" opacity="0.72"/>
  </g>

  <g filter="url(#innerGlow)">
    <path d="M265 489V265c0-28 17-53 43-63l169-65c22-9 47-9 69 0l170 65c26 10 43 35 43 63v224" fill="none" stroke="url(#line)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <g opacity="0.96">
      <rect x="310" y="292" width="116" height="78" rx="10" fill="url(#box)"/>
      <rect x="454" y="292" width="116" height="78" rx="10" fill="url(#box)"/>
      <rect x="598" y="292" width="116" height="78" rx="10" fill="url(#box)"/>
      <rect x="310" y="412" width="116" height="78" rx="10" fill="url(#box)"/>
      <rect x="454" y="412" width="116" height="78" rx="10" fill="url(#box)"/>
      <rect x="598" y="412" width="116" height="78" rx="10" fill="url(#box)"/>
      <rect x="310" y="383" width="116" height="18" rx="7" fill="#d9e8f8"/>
      <rect x="454" y="383" width="116" height="18" rx="7" fill="#d9e8f8"/>
      <rect x="598" y="383" width="116" height="18" rx="7" fill="#d9e8f8"/>
    </g>
  </g>

  <text x="512" y="756" text-anchor="middle" fill="url(#blue)" font-family="Arial, Helvetica, sans-serif" font-size="262" font-weight="700" letter-spacing="8">TPL</text>
  <text x="512" y="873" text-anchor="middle" fill="#08275b" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="750" letter-spacing="1.2">Weekly Data System</text>
  <path d="M261 903h502" stroke="#b9d3ef" stroke-width="11" stroke-linecap="round" opacity="0.5"/>
</svg>
